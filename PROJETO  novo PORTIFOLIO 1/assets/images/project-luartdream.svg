<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-luart" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140f1a"/>
      <stop offset="50%" stop-color="#21152b"/>
      <stop offset="100%" stop-color="#0a080d"/>
    </linearGradient>
    <linearGradient id="purple-pink-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow-luart" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg-luart)"/>

  <!-- Ambient Glow -->
  <circle cx="680" cy="140" r="160" fill="#ec4899" opacity="0.12" filter="url(#glow-luart)"/>
  <circle cx="140" cy="380" r="140" fill="#8b5cf6" opacity="0.1" filter="url(#glow-luart)"/>

  <!-- Mockup Frame -->
  <rect x="60" y="40" width="680" height="420" rx="16" fill="#171120" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <rect x="60" y="40" width="680" height="45" rx="16" fill="#231730"/>
  <circle cx="90" cy="62" r="5" fill="#ef4444"/>
  <circle cx="110" cy="62" r="5" fill="#f59e0b"/>
  <circle cx="130" cy="62" r="5" fill="#10b981"/>
  <rect x="240" y="52" width="320" height="22" rx="11" fill="rgba(0,0,0,0.3)"/>
  <text x="400" y="67" fill="#c084fc" font-family="sans-serif" font-size="11" text-anchor="middle">luartdream.com.br/catalogo</text>

  <!-- Content -->
  <g transform="translate(90, 110)">
    <rect x="0" y="0" width="165" height="24" rx="12" fill="rgba(236, 72, 153, 0.15)" stroke="rgba(236, 72, 153, 0.4)"/>
    <text x="82" y="16" fill="#f472b6" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">MODA &amp; SLEEPWEAR EXCLUSIVA</text>

    <text x="0" y="55" fill="#ffffff" font-family="sans-serif" font-size="28" font-weight="900">LUART DREAM</text>
    <text x="0" y="80" fill="#ec4899" font-family="sans-serif" font-size="18" font-weight="600">CATÁLOGO DIGITAL &amp; E-COMMERCE</text>
    <text x="0" y="110" fill="#a1a1aa" font-family="sans-serif" font-size="12">Pijamas confortáveis, tecidos premium e compra rápida sem atrito pelo WhatsApp.</text>

    <!-- Product Showcase Grid -->
    <g transform="translate(0, 140)">
      <!-- Item 1 -->
      <rect x="0" y="0" width="185" height="120" rx="10" fill="#20152b" stroke="rgba(236,72,153,0.2)"/>
      <circle cx="30" cy="30" r="16" fill="rgba(236,72,153,0.2)"/>
      <text x="30" y="36" fill="#f472b6" font-size="14" text-anchor="middle">👗</text>
      <text x="56" y="30" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">Pijama Seda Glow</text>
      <text x="56" y="46" fill="#ec4899" font-family="sans-serif" font-size="11" font-weight="bold">R$ 139,90</text>
      <text x="14" y="75" fill="#a1a1aa" font-family="sans-serif" font-size="10">Toque acetinado e leve</text>
      
      <rect x="14" y="90" width="157" height="20" rx="4" fill="rgba(236,72,153,0.15)"/>
      <text x="92" y="104" fill="#f472b6" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Adicionar ao Carrinho +</text>

      <!-- Item 2 -->
      <rect x="195" y="0" width="185" height="120" rx="10" fill="#20152b" stroke="rgba(236,72,153,0.2)"/>
      <circle cx="225" cy="30" r="16" fill="rgba(236,72,153,0.2)"/>
      <text x="225" y="36" fill="#f472b6" font-size="14" text-anchor="middle">✨</text>
      <text x="251" y="30" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">Short Doll Cozy</text>
      <text x="251" y="46" fill="#ec4899" font-family="sans-serif" font-size="11" font-weight="bold">R$ 89,90</text>
      <text x="209" y="75" fill="#a1a1aa" font-family="sans-serif" font-size="10">Algodão egípcio 100%</text>

      <rect x="209" y="90" width="157" height="20" rx="4" fill="rgba(236,72,153,0.15)"/>
      <text x="287" y="104" fill="#f472b6" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Adicionar ao Carrinho +</text>
    </g>

    <!-- Visual Card Showcase -->
    <g transform="translate(400, 15)">
      <rect x="0" y="0" width="200" height="245" rx="16" fill="#181122" stroke="rgba(236,72,153,0.3)"/>
      <circle cx="100" cy="65" r="40" fill="rgba(236,72,153,0.1)"/>
      <text x="100" y="75" fill="#ec4899" font-size="34" text-anchor="middle">🛍️</text>

      <text x="100" y="130" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Catálogo Interativo</text>
      <text x="100" y="150" fill="#a1a1aa" font-family="sans-serif" font-size="10" text-anchor="middle">Integrado com WhatsApp</text>
      <text x="100" y="170" fill="#22c55e" font-family="sans-serif" font-size="10" text-anchor="middle">★ Conversão de 82%</text>

      <rect x="20" y="195" width="160" height="34" rx="17" fill="url(#purple-pink-grad)"/>
      <text x="100" y="217" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Fazer Pedido Agora</text>
    </g>
  </g>
</svg>
