<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-clinic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09141f"/>
      <stop offset="50%" stop-color="#0f2030"/>
      <stop offset="100%" stop-color="#060c14"/>
    </linearGradient>
    <linearGradient id="cyan-glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow-clinic" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg-clinic)"/>

  <!-- Ambient Glow -->
  <circle cx="680" cy="150" r="160" fill="#38bdf8" opacity="0.12" filter="url(#glow-clinic)"/>
  <circle cx="120" cy="360" r="140" fill="#2dd4bf" opacity="0.08" filter="url(#glow-clinic)"/>

  <!-- Mockup Frame -->
  <rect x="60" y="40" width="680" height="420" rx="16" fill="#0d1726" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <rect x="60" y="40" width="680" height="45" rx="16" fill="#142136"/>
  <circle cx="90" cy="62" r="5" fill="#ef4444"/>
  <circle cx="110" cy="62" r="5" fill="#f59e0b"/>
  <circle cx="130" cy="62" r="5" fill="#10b981"/>
  <rect x="240" y="52" width="320" height="22" rx="11" fill="rgba(0,0,0,0.3)"/>
  <text x="400" y="67" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">clinicalumina.med.br</text>

  <!-- Content -->
  <g transform="translate(90, 110)">
    <rect x="0" y="0" width="165" height="24" rx="12" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.4)"/>
    <text x="82" y="16" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">SAÚDE &amp; DERMATOLOGIA</text>

    <text x="0" y="55" fill="#ffffff" font-family="sans-serif" font-size="28" font-weight="900">CLÍNICA LUMINA</text>
    <text x="0" y="80" fill="#38bdf8" font-family="sans-serif" font-size="18" font-weight="600">ESTÉTICA &amp; BEM-ESTAR</text>
    <text x="0" y="110" fill="#94a3b8" font-family="sans-serif" font-size="12">Atendimento humanizado, corpo clínico renomado e agendamento simplificado.</text>

    <!-- Medical Services List -->
    <g transform="translate(0, 140)">
      <rect x="0" y="0" width="185" height="115" rx="10" fill="#131d2e" stroke="rgba(56,189,248,0.15)"/>
      <circle cx="30" cy="30" r="15" fill="rgba(56,189,248,0.2)"/>
      <text x="30" y="35" fill="#38bdf8" font-size="14" text-anchor="middle">✨</text>
      <text x="55" y="34" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">Dermatologia</text>
      <text x="14" y="65" fill="#94a3b8" font-family="sans-serif" font-size="10">Tratamentos faciais &amp; laser</text>
      <text x="14" y="92" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold">Agendamento Online →</text>

      <rect x="195" y="0" width="185" height="115" rx="10" fill="#131d2e" stroke="rgba(56,189,248,0.15)"/>
      <circle cx="225" cy="30" r="15" fill="rgba(56,189,248,0.2)"/>
      <text x="225" y="35" fill="#38bdf8" font-size="14" text-anchor="middle">🌿</text>
      <text x="250" y="34" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">Harmonização</text>
      <text x="209" y="65" fill="#94a3b8" font-family="sans-serif" font-size="10">Procedimentos minimamente invasivos</text>
      <text x="209" y="92" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold">Saiba mais →</text>
    </g>

    <!-- Google 5 Star Local Rating Box -->
    <g transform="translate(400, 20)">
      <rect x="0" y="0" width="200" height="235" rx="14" fill="#101a2b" stroke="rgba(56,189,248,0.25)"/>
      
      <circle cx="100" cy="60" r="35" fill="rgba(56,189,248,0.1)"/>
      <text x="100" y="68" fill="#38bdf8" font-size="28" text-anchor="middle">🏥</text>
      
      <text x="100" y="125" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Google Perfil 5.0 ★</text>
      <text x="100" y="145" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Mais de 250 avaliações</text>
      <text x="100" y="165" fill="#22c55e" font-family="sans-serif" font-size="10" text-anchor="middle">● Top 1 em buscas na região</text>

      <rect x="25" y="185" width="150" height="32" rx="16" fill="url(#cyan-glow-grad)"/>
      <text x="100" y="206" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Marcar Consulta</text>
    </g>
  </g>
</svg>
