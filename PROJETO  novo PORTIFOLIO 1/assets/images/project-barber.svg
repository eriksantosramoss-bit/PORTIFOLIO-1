<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-barber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121316"/>
      <stop offset="50%" stop-color="#1a1c23"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg-barber)"/>
  
  <!-- Subtle pattern grid -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <!-- Ambient Glow -->
  <circle cx="650" cy="150" r="180" fill="#f59e0b" opacity="0.12" filter="url(#glow)"/>
  <circle cx="150" cy="380" r="140" fill="#d97706" opacity="0.08" filter="url(#glow)"/>

  <!-- Browser/UI Mockup Container -->
  <rect x="60" y="40" width="680" height="420" rx="16" fill="#161822" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
  
  <!-- Top Bar -->
  <rect x="60" y="40" width="680" height="45" rx="16" fill="#1f2333"/>
  <circle cx="90" cy="62" r="5" fill="#ef4444"/>
  <circle cx="110" cy="62" r="5" fill="#f59e0b"/>
  <circle cx="130" cy="62" r="5" fill="#10b981"/>
  <rect x="240" y="52" width="320" height="22" rx="11" fill="rgba(0,0,0,0.3)"/>
  <text x="400" y="67" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" text-anchor="middle">vintagebladebarber.com.br</text>

  <!-- Hero inside mockup -->
  <g transform="translate(90, 110)">
    <!-- Badge -->
    <rect x="0" y="0" width="140" height="24" rx="12" fill="rgba(245, 158, 11, 0.15)" stroke="rgba(245, 158, 11, 0.4)"/>
    <text x="70" y="16" fill="#fbbf24" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">TRADIÇÃO &amp; ESTILO</text>

    <!-- Headline -->
    <text x="0" y="55" fill="#ffffff" font-family="sans-serif" font-size="28" font-weight="900" letter-spacing="-0.5">VINTAGE BLADE</text>
    <text x="0" y="80" fill="#f59e0b" font-family="sans-serif" font-size="20" font-weight="bold">BARBER CLUB &amp; LOUNGE</text>
    <text x="0" y="110" fill="#94a3b8" font-family="sans-serif" font-size="12">Agendamento online 24h • Cortes clássicos e barba na toalha quente.</text>

    <!-- CTA Button -->
    <rect x="0" y="130" width="160" height="38" rx="19" fill="url(#gold-grad)"/>
    <text x="80" y="154" fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Agendar Horário ✂</text>
    
    <!-- Services Cards Inside -->
    <g transform="translate(0, 190)">
      <rect x="0" y="0" width="180" height="110" rx="10" fill="#1c2130" stroke="rgba(255,255,255,0.06)"/>
      <circle cx="30" cy="30" r="16" fill="rgba(245,158,11,0.2)"/>
      <text x="30" y="35" fill="#fbbf24" font-family="sans-serif" font-size="14" text-anchor="middle">💈</text>
      <text x="56" y="34" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Corte Executivo</text>
      <text x="14" y="65" fill="#94a3b8" font-family="sans-serif" font-size="10">Consultoria de visagismo</text>
      <text x="14" y="90" fill="#fbbf24" font-family="sans-serif" font-size="14" font-weight="bold">R$ 55,00</text>

      <rect x="195" y="0" width="180" height="110" rx="10" fill="#1c2130" stroke="rgba(255,255,255,0.06)"/>
      <circle cx="225" cy="30" r="16" fill="rgba(245,158,11,0.2)"/>
      <text x="225" y="35" fill="#fbbf24" font-family="sans-serif" font-size="14" text-anchor="middle">🪒</text>
      <text x="251" y="34" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Barba Terapia</text>
      <text x="209" y="65" fill="#94a3b8" font-family="sans-serif" font-size="10">Toalha quente e óleos</text>
      <text x="209" y="90" fill="#fbbf24" font-family="sans-serif" font-size="14" font-weight="bold">R$ 45,00</text>
    </g>

    <!-- Visual Element (Barber Pole Stylized) -->
    <g transform="translate(430, 20)">
      <rect x="0" y="0" width="160" height="260" rx="14" fill="#131622" stroke="rgba(245, 158, 11, 0.3)"/>
      <circle cx="80" cy="80" r="45" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,4"/>
      <text x="80" y="88" fill="#ffffff" font-size="34" text-anchor="middle">✂</text>
      <text x="80" y="150" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">4.9 ★★★★★</text>
      <text x="80" y="170" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Mais de 420 avaliações</text>
      <rect x="20" y="195" width="120" height="30" rx="15" fill="#25D366"/>
      <text x="80" y="214" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">WhatsApp Direto</text>
    </g>
  </g>
</svg>
